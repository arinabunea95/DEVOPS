name: Run Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Run demo
        run: |
          cd python_project
          python academy_project.py

      - name: Run unit tests
        run: |
          cd python_project
          python -m unittest test_academy_project.py